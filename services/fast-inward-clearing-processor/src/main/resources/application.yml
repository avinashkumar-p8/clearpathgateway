spring:
  application:
    name: fast-inward-clearing-processor
  profiles:
    active: test

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      retries: 3
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        schema.registry.basic.auth.user.info: ${SCHEMA_REGISTRY_USERNAME:}:${SCHEMA_REGISTRY_PASSWORD:}
        basic.auth.credentials.source: USER_INFO
        auto.register.schemas: true
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        schema.registry.basic.auth.user.info: ${SCHEMA_REGISTRY_USERNAME:}:${SCHEMA_REGISTRY_PASSWORD:}
        specific.avro.reader: true
        auto.register.schemas: true

  # Spanner Configuration
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
      spanner:
        instance-id: ${SPANNER_INSTANCE:payment-gateway-local}
        database: ${SPANNER_DATABASE:inward-processor-db}
        emulator:
          enabled: true

  # Schema Event Topics
  schema:
    registration:
      topic: schema-registration-events
    update:
      topic: schema-update-events
    delete:
      topic: schema-delete-events
    event:
      topic: schema-events

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Application Configuration
app:
  name: Fast Inward Clearing Processor
  version: 21.0.0-apeafast-SNAPSHOT

  # Kafka Topics Configuration
  kafka:
    topics:
      input: transactions.incoming
      output: fast-outward-clearing
      dlq: fast-inward-clearing-dlq

  # Idempotency Configuration
  idempotency:
    cache:
      muid:
        ttl-seconds: 3600
        max-entries: 10000
        eviction-policy: LRU
    database:
      cleanup:
        enabled: true
        retention-days: 90
        batch-size: 1000
        schedule: "0 2 * * *"
    logging:
      level: INFO
      include-muid: true
      include-topic: false
      include-partition: false
      include-offset: false
    monitoring:
      enabled: true
      metrics-prefix: "kafka.idempotency"
      health-check:
        enabled: true
        timeout-seconds: 30
    error-handling:
      max-retries: 3
      backoff-multiplier: 2.0
      initial-delay-ms: 1000
    security:
      audit-logging: true
      sensitive-data-masking: true
      encryption:
        enabled: false
        algorithm: "AES-256"

  # Processing Configuration
  processing:
    node-id: inward-processor-01

  # SLA Configuration
  sla:
    timeout-seconds: ${SLA_TIMEOUT_SECONDS:4.5}
    warning-threshold-seconds: 3.0

  # External service endpoints
  external:
    vam-endpoint: ${VAM_ENDPOINT:http://localhost:8445/vam}
    midanz-endpoint: ${MIDANZ_ENDPOINT:http://localhost:8446/midanz}
    liquidity-service-url: ${LIQUIDITY_SERVICE_URL:http://fast-liquidity-service:8084}
    sender-service-url: ${SENDER_SERVICE_URL:http://fast-sender-service:8083}

  # Circuit breaker configuration
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    sliding-window-size: 10

# Cache configuration
cache:
  type: simple
  cache-names: muidCache,currencyCache,countryCache

# Logging Configuration
logging:
  level:
    com.anz.fastpayment: DEBUG
    org.springframework.statemachine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] - %msg%n"

---
# Local Profile Configuration
spring:
  config:
    activate:
      on-profile: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
      spanner:
        instance-id: ${SPANNER_INSTANCE:payment-gateway-local}
        database: ${SPANNER_DATABASE:inward-processor-db}
        emulator:
          enabled: true

---
# Test Profile Configuration
spring:
  config:
    activate:
      on-profile: test
  kafka:
    producer:
      properties:
        enable.idempotence: true
    listener:
      concurrency: 3
      ack-mode: manual
      type: single
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2.0
        max-interval: 10s
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
      spanner:
        instance-id: ${SPANNER_INSTANCE:payment-gateway-local}
        database: ${SPANNER_DATABASE:inward-processor-db}
        emulator:
          enabled: true
  cache:
    type: simple
    cache-names: muidCache,currencyCache,countryCache

---
# GCP Production Profile Configuration
spring:
  config:
    activate:
      on-profile: gcp
  kafka:
    producer:
      properties:
        enable.idempotence: true
    listener:
      concurrency: 3
      ack-mode: manual
      type: single
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2.0
        max-interval: 10s
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
      credentials:
        location: ${GOOGLE_APPLICATION_CREDENTIALS}
      spanner:
        instance-id: ${SPANNER_INSTANCE:payment-gateway}
        database: ${SPANNER_DATABASE:inward-processor-db}
        emulator:
          enabled: false