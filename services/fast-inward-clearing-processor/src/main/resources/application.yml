spring:
  application:
    name: fast-inward-clearing-processor
  profiles:
    active: local

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      retries: 3
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        schema.registry.basic.auth.user.info: ${SCHEMA_REGISTRY_USERNAME:}:${SCHEMA_REGISTRY_PASSWORD:}
        basic.auth.credentials.source: USER_INFO
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        schema.registry.basic.auth.user.info: ${SCHEMA_REGISTRY_USERNAME:}:${SCHEMA_REGISTRY_PASSWORD:}
        specific.avro.reader: true

  # Spanner Configuration
  cloud:
    gcp:
      spanner:
        project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
        instance-id: ${SPANNER_INSTANCE:payment-gateway}
        database: ${SPANNER_DATABASE:inward-processor-db}
        emulator-host: ${SPANNER_EMULATOR_HOST:localhost:9010}
        auto-create-interleaved-table-ddl-on-delete-cascade: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# Application Configuration
app:
  name: Fast Inward Clearing Processor
  version: 21.0.0-apeafast-SNAPSHOT

  # Idempotency Configuration for Banking Operations
  idempotency:
    cache:
      muid:
        ttl-seconds: 3600  # 1 hour TTL for MUID cache
        max-entries: 10000 # Maximum entries in cache
        eviction-policy: LRU
    
    database:
      cleanup:
        enabled: true
        retention-days: 90  # Keep MUID records for 90 days
        batch-size: 1000    # Batch size for cleanup operations
        schedule: "0 2 * * *" # Daily at 2 AM
    
    logging:
      level: INFO
      include-muid: true
      include-topic: false  # Don't log topic for security
      include-partition: false  # Don't log partition for security
      include-offset: false  # Don't log offset for security
    
    monitoring:
      enabled: true
      metrics-prefix: "kafka.idempotency"
      health-check:
        enabled: true
        timeout-seconds: 30
    
    error-handling:
      max-retries: 3
      backoff-multiplier: 2.0
      initial-delay-ms: 1000
        
    security:
      audit-logging: true
      sensitive-data-masking: true
      encryption:
        enabled: false  # Enable if encryption is required
        algorithm: "AES-256"

  # Kafka Topic Configuration
  kafka:
    topics:
      input: transactions.incoming
      output: transactions.processed
      dlq: transactions.dlq

    producer:
      acks: all
      retries: 3
    schema-registry:
      url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      username: ${SCHEMA_REGISTRY_USERNAME:}
      password: ${SCHEMA_REGISTRY_PASSWORD:}

  # Processing Configuration
  processing:
    node-id: inward-processor-01

  # SLA Configuration
  sla:
    timeout-seconds: ${SLA_TIMEOUT_SECONDS:4.5}
    warning-threshold-seconds: 3.0

  # External service endpoints
  external:
    vam-endpoint: ${VAM_ENDPOINT:http://localhost:8445/vam}
    midanz-endpoint: ${MIDANZ_ENDPOINT:http://localhost:8446/midanz}
    liquidity-service-url: ${LIQUIDITY_SERVICE_URL:http://fast-liquidity-service:8084}
    sender-service-url: ${SENDER_SERVICE_URL:http://fast-sender-service:8083}

  # Circuit breaker configuration
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    sliding-window-size: 10

  # Cache configuration - use in-memory cache instead of Redis
  cache:
    type: simple  # Use in-memory cache instead of Redis
    cache-names: muidCache,currencyCache,countryCache



logging:
  level:
    com.anz.fastpayment: DEBUG
    org.springframework.statemachine: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    producer:
      properties:
        enable.idempotence: true
    listener:
      concurrency: 3
      ack-mode: manual
      type: single
      # Retry configuration
      retry:
        enabled: true
        initial-interval: 1s
        max-attempts: 3
        multiplier: 2.0
        max-interval: 10s
  # Spanner Configuration for Test Profile
  cloud:
    gcp:
      spanner:
        project-id: ${GCP_PROJECT_ID:anz-fastpayment-sg}
        instance-id: ${SPANNER_INSTANCE:payment-gateway}
        database: ${SPANNER_DATABASE:inward-processor-db}
  cache:
    type: simple  # Use in-memory cache instead of Redis
    cache-names: muidCache,currencyCache,countryCache

